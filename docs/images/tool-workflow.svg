<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title">
  <title id="title">批次、漫画与数据驱动节点工作流</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><filter id="s"><feDropShadow dy="4" stdDeviation="6" flood-opacity=".2"/></filter></defs>
  <rect width="1200" height="350" rx="24" fill="#f4faf9"/><text x="55" y="52" font-family="Arial,'Microsoft YaHei'" font-size="25" font-weight="700" fill="#172033">批次与工具：让重复工作自动流动</text>
  <g font-family="Arial,'Microsoft YaHei'" filter="url(#s)">
    <g transform="translate(55 82)"><rect width="225" height="92" rx="12" fill="#172033"/><rect width="225" height="32" rx="12" fill="#0891b2"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">多张 IMAGE</text><text x="16" y="66" fill="#cbd5e1" font-size="14">单图输入 × 最多 10 路</text></g>
    <g transform="translate(360 82)"><rect width="225" height="92" rx="12" fill="#172033"/><rect width="225" height="32" rx="12" fill="#0284c7"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">TUT_图像到批次</text><text x="16" y="66" fill="#cbd5e1" font-size="14">保持比例，透明补边</text></g>
    <g transform="translate(665 82)"><rect width="225" height="92" rx="12" fill="#172033"/><rect width="225" height="32" rx="12" fill="#db2777"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">TUT_漫画分镜画布</text><text x="16" y="66" fill="#cbd5e1" font-size="14">自动分页 · 调整画框</text></g>
    <g transform="translate(970 82)"><rect width="175" height="92" rx="12" fill="#172033"/><rect width="175" height="32" rx="12" fill="#7c3aed"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">漫画页面</text><text x="16" y="66" fill="#cbd5e1" font-size="14">IMAGE 批次</text></g>
    <g transform="translate(55 218)"><rect width="225" height="92" rx="12" fill="#172033"/><rect width="225" height="32" rx="12" fill="#16a34a"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">TUT_读取Excel</text><text x="16" y="66" fill="#cbd5e1" font-size="14">xlsx · xlsm · csv</text></g>
    <g transform="translate(360 218)"><rect width="225" height="92" rx="12" fill="#172033"/><rect width="225" height="32" rx="12" fill="#059669"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">Excel 批次读取</text><text x="16" y="66" fill="#cbd5e1" font-size="14">每行或每列一个文本项</text></g>
    <g transform="translate(665 218)"><rect width="225" height="92" rx="12" fill="#172033"/><rect width="225" height="32" rx="12" fill="#d97706"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">下游生成工作流</text><text x="16" y="66" fill="#cbd5e1" font-size="14">逐项生成 · 自动排队</text></g>
    <g transform="translate(970 218)"><rect width="175" height="92" rx="12" fill="#172033"/><rect width="175" height="32" rx="12" fill="#9333ea"/><text x="14" y="22" fill="white" font-size="15" font-weight="700">批量结果</text><text x="16" y="66" fill="#cbd5e1" font-size="14">图片 / 文本</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M280 128H350"/><path d="M585 128H655"/><path d="M890 128H960"/><path d="M280 264H350"/><path d="M585 264H655"/><path d="M890 264H960"/></g>
</svg>
